# This workflow does a clean install of dependencies, builds the source, and runs
# tests across Node versions. Uses pnpm (the repo's package manager).
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v5

      # Install pnpm BEFORE setup-node so `cache: pnpm` can find it.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 9 (not 11): pnpm 11 needs Node >=22.13 (breaks the 20.x matrix)
          # and hard-errors on un-approved dependency build scripts. pnpm 9
          # supports Node 18+ and reads the v9.0 lockfile.
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build --if-present
      - run: pnpm test
