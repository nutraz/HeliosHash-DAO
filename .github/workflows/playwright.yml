name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    # Install pnpm BEFORE setup-node so `cache: pnpm` can find it.
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        # pnpm 9 (not 11): pnpm 11 needs Node >=22.13 (breaks the 20.x matrix) and
        # hard-errors on un-approved dependency build scripts. pnpm 9 supports
        # Node 18+ and reads the v9.0 lockfile.
        version: 9

    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # NOTE: web package is named `helioshash-dao-web` (not `@hhdao/web`).
    - name: Install Playwright Browsers
      run: pnpm --filter helioshash-dao-web exec playwright install --with-deps

    - name: Build web app
      run: pnpm --filter helioshash-dao-web build

    - name: Start web server (background)
      run: |
        pnpm --filter helioshash-dao-web start &> web-server.log &
        echo $! > web.pid
        # wait for the server to become available (up to 60s)
        for i in {1..60}; do
          if curl -sSf http://localhost:3000/ > /dev/null; then
            echo "web server is up"; break
          fi
          sleep 1
        done

    - name: Run Playwright tests
      run: pnpm --filter helioshash-dao-web run test:e2e

    - name: Stop web server
      if: always()
      run: |
        if [ -f web.pid ]; then
          kill $(cat web.pid) || true
          rm -f web.pid
        fi
        # fallback: kill any lingering next start processes
        pkill -f 'next start' || true

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-report
        path: apps/web/playwright-report/
        retention-days: 30
